name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # A portfolio's whole pitch is that it is fast. The budget below is the
      # entry path a first-time visitor actually downloads before anything is
      # interactive — NOT the lazy three.js chunk, which only capable devices
      # ever fetch, and only after the cover screen.
      - name: Check entry bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

  a11y:
    name: Accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # axe-core against the real production build, scrolled through so the
      # lazy sections have actually mounted. Auditing first paint alone would
      # miss most of this site.
      - name: Serve and audit
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run test:a11y
